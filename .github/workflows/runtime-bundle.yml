name: Runtime qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tiger-style:
    name: TigerStyle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Check every tracked Zig file and the native auditor
        env:
          TIGER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/tiger-style.sh "$TIGER_HEAD"
      - name: Verify TigerStyle selection and failure behavior
        run: bash tools/test-tiger-style.sh
      - name: Verify compiler cache admission
        run: TMPDIR="$RUNNER_TEMP" bash tools/test-zig-cache.sh
  qualify:
    name: Qualify / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [sessions, session-ownership, source-regressions, native, native-driver, native-recovery, specialization, recovery-specialization, publication, source, source-second, portable, browser, consumer]
        include:
          - {lane: sessions, build: build-session-check -Dsession-group=behavior, tests: 59}
          - {lane: session-ownership, build: build-session-check -Dsession-group=ownership, tests: 17}
          - {lane: source-regressions, build: build-session-check -Dsession-group=regressions, tests: 17}
          - {lane: specialization, build: check-ordinary-specialization}
          - {lane: recovery-specialization, build: check-recovery-specialization}
          - {lane: publication, build: check-publication}
          - {lane: source, build: check-source -Dsource-group=first -Dfixture-profile=prepared_only}
          - {lane: source-second, build: check-source -Dsource-group=second -Dfixture-profile=prepared_only}
          - {lane: portable, build: check-activation-storage-wasm check-kernel check-capacity check-codecs check-package build-runtime}
          - {lane: browser, build: check-browser}
          - {lane: consumer, build: emit-native-input}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KOSMOS_HOST_TARGET: x86_64-linux.5.10...7.2-gnu.2.31
      KOSMOS_CACHE_SAVE: ${{ github.ref == 'refs/heads/main' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.1'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: matrix.lane == 'portable' || matrix.lane == 'browser' || matrix.lane == 'source' || matrix.lane == 'source-second'
        with:
          node-version: '26.9.0'
      - name: Check source formatting before compilation
        run: |
          git ls-files '*.zig' | xargs zig fmt --check
      - name: Choose the host CPU this runner executes
        run: |
          grep -m 1 '^model name' /proc/cpuinfo || printf '::warning::The runner names no CPU model\n'
          if ! cpu=$(bash tools/zig-cache.sh host-cpu < /proc/cpuinfo); then
            printf '::warning::Reading the runner CPU flags failed; building for baseline\n'
            cpu=baseline
          fi
          printf 'KOSMOS_HOST_CPU=%s\n' "$cpu" | tee -a "$GITHUB_ENV"
          printf 'KOSMOS_CACHE_PREFIX=kosmos-native-v6-%s-%s-0.17.1-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$KOSMOS_HOST_TARGET" "$cpu" | tee -a "$GITHUB_ENV"
      - name: Read the job's start and decide whether to restore the compiler cache
        id: start
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
        run: |
          started=$(timeout -k 1 10 gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID" --jq '.started_at | fromdate') ||
            started=
          started=${started//[^0-9]/}
          printf 'KOSMOS_JOB_STARTED=%s\n' "$started" | tee -a "$GITHUB_ENV"
          KOSMOS_JOB_STARTED=$started bash tools/zig-cache.sh due
      - name: Restore complete compiler cache
        id: cache
        if: steps.start.outputs.due == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache.saved
          key: ${{ env.KOSMOS_CACHE_PREFIX }}/${{ matrix.lane }}/${{ hashFiles('build.zig.zon', 'build-profile.json') }}-${{ github.run_number }}-${{ github.run_attempt }}-checked
          restore-keys: |
            ${{ env.KOSMOS_CACHE_PREFIX }}/${{ matrix.lane }}/${{ hashFiles('build.zig.zon', 'build-profile.json') }}-
            ${{ env.KOSMOS_CACHE_PREFIX }}/${{ matrix.lane == 'native-recovery' && 'native-driver' || matrix.lane == 'native-driver' && 'native' || (matrix.lane == 'publication' || matrix.lane == 'recovery-specialization') && 'specialization' || matrix.lane }}/${{ hashFiles('build.zig.zon', 'build-profile.json') }}-
            ${{ env.KOSMOS_CACHE_PREFIX }}/${{ matrix.lane == 'source' && 'source-second' || matrix.lane }}/${{ hashFiles('build.zig.zon', 'build-profile.json') }}-
            ${{ env.KOSMOS_CACHE_PREFIX }}/${{ matrix.lane }}/
            ${{ env.KOSMOS_CACHE_PREFIX }}/${{ matrix.lane == 'browser' && 'portable' || (matrix.lane == 'publication' || matrix.lane == 'recovery-specialization') && 'specialization' || matrix.lane }}/
      - name: Record native compiler and restored target identities
        if: startsWith(matrix.lane, 'native') || matrix.lane == 'source'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          builtin_target() {
            awk '
              /^pub const (cpu|os):/ { active=1 }
              active {
                gsub(/^[[:space:]]+/, "")
                printf "%s ", $0
              }
              active && /^};/ { print ""; active=0 }
            '
          }
          zig version
          sha256sum "$(command -v zig)"
          printf 'CURRENT NATIVE TARGET\n'
          zig build-exe --show-builtin -fno-llvm -Osafe -mcpu=native \
            --global-cache-dir "$RUNNER_TEMP/zig-target-diagnostic-global" \
            --cache-dir "$RUNNER_TEMP/zig-target-diagnostic-local" |
            builtin_target
          cached_builtins=()
          if [ -d .zig-cache.saved/b ]; then
            mapfile -t cached_builtins < <(
              find .zig-cache.saved/b -mindepth 2 -maxdepth 2 \
                -type f -name builtin.zig -print | LC_ALL=C sort
            )
          fi
          printf 'RESTORED BUILTINS: %s; displaying at most 32\n' "${#cached_builtins[@]}"
          for builtin_file in "${cached_builtins[@]:0:32}"; do
            sha256sum "$builtin_file"
            builtin_target < "$builtin_file"
          done
      - name: Build the compiler cache pairing tool
        if: env.KOSMOS_CACHE_SAVE == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: bash tools/zig-cache.sh tool
      - name: Verify the restored compiler cache against its record and track its use
        continue-on-error: true
        timeout-minutes: 1
        env:
          RESTORE: ${{ steps.cache.outcome }}
        run: bash tools/zig-cache.sh track "$RESTORE"
      - name: Compile native qualification and independently rebuild the core
        if: startsWith(matrix.lane, 'native')
        run: |
          nproc
          free -m
          vmstat -w 30 &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true' EXIT
          if [ "${{ matrix.lane }}" = native ]; then
            /usr/bin/time -v zig build build-storage-check build-semantics-check \
              build-zig17-check --cache-dir .zig-cache/native-owners \
              -Dtarget="$KOSMOS_HOST_TARGET" -Dcpu="$KOSMOS_HOST_CPU" \
              -Dhost-target="$KOSMOS_HOST_TARGET" -Dhost-cpu="$KOSMOS_HOST_CPU" \
              -Doptimize=safe --summary all --verbose
          elif [ "${{ matrix.lane }}" = native-recovery ]; then
            /usr/bin/time -v zig build build-semantic-recovery-driver \
              --cache-dir .zig-cache/native-driver \
              -Dtarget="$KOSMOS_HOST_TARGET" -Dcpu="$KOSMOS_HOST_CPU" \
              -Dhost-target="$KOSMOS_HOST_TARGET" -Dhost-cpu="$KOSMOS_HOST_CPU" \
              -Doptimize=safe --summary all --verbose
          else
            ZIG_LOCAL_PKG_DIR="$PWD/.zig-cache/native-driver-core/zig-pkg" \
              ZIG_GLOBAL_CACHE_DIR="$PWD/.zig-cache/native-driver-core" \
              /usr/bin/time -v zig build semantic-artifact --prefix "$RUNNER_TEMP/driver-core" \
              --cache-dir .zig-cache/native-driver-core \
              -Dtarget="$KOSMOS_HOST_TARGET" -Dcpu="$KOSMOS_HOST_CPU" \
              -Dhost-target="$KOSMOS_HOST_TARGET" -Dhost-cpu="$KOSMOS_HOST_CPU" \
              -Doptimize=safe --summary all --verbose &
            core_pid=$!
            /usr/bin/time -v zig build build-semantic-driver-executable \
              --cache-dir .zig-cache/native-driver \
              -Dtarget="$KOSMOS_HOST_TARGET" -Dcpu="$KOSMOS_HOST_CPU" \
              -Dhost-target="$KOSMOS_HOST_TARGET" -Dhost-cpu="$KOSMOS_HOST_CPU" \
              -Doptimize=safe --summary all --verbose &
            driver_pid=$!
            status=0
            wait "$core_pid" || status=1
            wait "$driver_pid" || status=1
            exit "$status"
          fi
      - name: Compile the lane's qualification without running it
        if: matrix.build
        run: >-
          zig build ${{ matrix.build }} -Dcompile-only=true
          -Dtarget="$KOSMOS_HOST_TARGET" -Dcpu="$KOSMOS_HOST_CPU"
          -Dhost-target="$KOSMOS_HOST_TARGET" -Dhost-cpu="$KOSMOS_HOST_CPU"
          -Doptimize=safe -Dpackaged-runtime=true --summary all
      - name: Set aside what the compilation did not use
        id: compiled
        if: env.KOSMOS_CACHE_SAVE == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: bash tools/zig-cache.sh stage
      - name: Save the compiled lane's cache before running it
        if: steps.compiled.outputs.save == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache.saved
          key: ${{ env.KOSMOS_CACHE_PREFIX }}/${{ matrix.lane }}/${{ hashFiles('build.zig.zon', 'build-profile.json') }}-${{ github.run_number }}-${{ github.run_attempt }}-compiled
      - name: Return what the compilation did not use for the checks
        if: env.KOSMOS_CACHE_SAVE == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: bash tools/zig-cache.sh unstage
      - name: Check native owners and independently rebuild the core
        if: startsWith(matrix.lane, 'native')
        run: |
          if [ "${{ matrix.lane }}" = native ]; then
            zig build check-storage check-semantics check-zig17 \
              --cache-dir .zig-cache/native-owners \
              -Dtarget="$KOSMOS_HOST_TARGET" -Dcpu="$KOSMOS_HOST_CPU" \
              -Dhost-target="$KOSMOS_HOST_TARGET" -Dhost-cpu="$KOSMOS_HOST_CPU" \
              -Doptimize=safe --summary all
          elif [ "${{ matrix.lane }}" = native-recovery ]; then
            zig build check-semantic-recovery-driver \
              --cache-dir .zig-cache/native-driver \
              -Dtarget="$KOSMOS_HOST_TARGET" -Dcpu="$KOSMOS_HOST_CPU" \
              -Dhost-target="$KOSMOS_HOST_TARGET" -Dhost-cpu="$KOSMOS_HOST_CPU" \
              -Doptimize=safe --summary all
          else
            zig build check-installed-semantic-driver --prefix "$RUNNER_TEMP/driver-core" \
              --cache-dir .zig-cache/native-driver \
              -Dtarget="$KOSMOS_HOST_TARGET" -Dcpu="$KOSMOS_HOST_CPU" \
              -Dhost-target="$KOSMOS_HOST_TARGET" -Dhost-cpu="$KOSMOS_HOST_CPU" \
              -Doptimize=safe --summary all
          fi
      - name: Install only the browser boundary's tools
        if: matrix.lane == 'browser'
        run: |
          npm ci --ignore-scripts --prefix test/current/browser-tools
          node test/current/browser-tools/node_modules/playwright-core/cli.js install chromium firefox
      - name: Qualify the lane
        if: matrix.build
        run: >-
          zig build ${{ matrix.build }}
          -Dtarget="$KOSMOS_HOST_TARGET" -Dcpu="$KOSMOS_HOST_CPU"
          -Dhost-target="$KOSMOS_HOST_TARGET" -Dhost-cpu="$KOSMOS_HOST_CPU"
          -Doptimize=safe -Dpackaged-runtime=true --summary all
      - name: Check every selected current session fixture
        if: matrix.tests
        run: |
          set -o pipefail
          if grep '^test "' test/v2/stable_source.zig | grep -Ev '^test "(behavior|ownership): '; then
            exit 1
          fi
          zig-out/verification/sessions 2>&1 | tee "$RUNNER_TEMP/session-tests.log"
          if command -v rg >/dev/null; then
            rg -Fxq "All ${{ matrix.tests }} tests passed." "$RUNNER_TEMP/session-tests.log"
          else
            grep -Fxq "All ${{ matrix.tests }} tests passed." "$RUNNER_TEMP/session-tests.log"
          fi
      - name: Consume the actual native source package without a JS producer
        if: matrix.lane == 'consumer'
        run: |
          scratch=$RUNNER_TEMP/native-consumer
          rm -rf "$scratch"
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch" "$scratch/source" "$scratch/kosmos" "$scratch/consumer" "$scratch/system"
          git --no-replace-objects archive --format=tar HEAD > "$scratch/source.tar"
          tar -xf "$scratch/source.tar" -C "$scratch/source"
          package_hash=$(ZIG_GLOBAL_CACHE_DIR="$scratch/cache" zig fetch "$scratch/source")
          tar -xzf "$scratch/cache/p/$package_hash.tar.gz" --strip-components=1 -C "$scratch/kosmos"
          cp test/native_consumer/build.zig test/native_consumer/build.zig.zon test/native_consumer/main.zig "$scratch/consumer/"
          legacy_hash=$(awk -F'"' '/^[[:space:]]*\.horos = / { legacy=1 } legacy && /\.hash = / { print $2; exit }' build.zig.zon)
          test -n "$legacy_hash"
          cp -R "zig-pkg/$legacy_hash" "$scratch/system/$legacy_hash"
          zig build --build-file "$scratch/consumer/build.zig" \
            --system "$scratch/system" --cache-dir "$PWD/.zig-cache/native-consumer" \
            -Dtarget="$KOSMOS_HOST_TARGET" -Dcpu="$KOSMOS_HOST_CPU" \
            -Dhost-target="$KOSMOS_HOST_TARGET" -Dhost-cpu="$KOSMOS_HOST_CPU" \
            -Doptimize=safe -Dimage="$PWD/zig-out/native-consumer.bpi3" --summary all
      - name: Package the tested ordinary JS consumer
        if: matrix.lane == 'portable'
        working-directory: zig-out/runtime
        run: |
          archive=$(npm pack --offline --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")
          mv "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/kosmos-runtime-package.tar.gz"
      - name: Retain the tested package
        if: matrix.lane == 'portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kosmos-runtime-package-${{ github.sha }}
          path: ${{ runner.temp }}/kosmos-runtime-package.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Prune the compiler cache to what the job used
        id: checked
        if: env.KOSMOS_CACHE_SAVE == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: bash tools/zig-cache.sh admit
      - name: Save the checked lane's compiler cache
        if: steps.checked.outputs.save == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache.saved
          key: ${{ env.KOSMOS_CACHE_PREFIX }}/${{ matrix.lane }}/${{ hashFiles('build.zig.zon', 'build-profile.json') }}-${{ github.run_number }}-${{ github.run_attempt }}-checked
  runtime-complete:
    name: Runtime qualification budget
    needs: qualify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require runtime qualification within ten minutes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          QUALIFICATION: ${{ needs.qualify.result }}
        run: |
          test "$QUALIFICATION" = success
          started="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .run_started_at)"
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "Runtime qualification before budget gate: ${elapsed}s (maximum 600s; TigerStyle exempt)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -le 600
  complete:
    name: Complete qualification
    needs: [tiger-style, runtime-complete]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require TigerStyle and bounded runtime qualification
        env:
          TIGER_STYLE: ${{ needs.tiger-style.result }}
          QUALIFICATION: ${{ needs.runtime-complete.result }}
        run: |
          test "$TIGER_STYLE" = success
          test "$QUALIFICATION" = success
  cache-retention:
    name: Keep one compiler cache per lane and CPU
    needs: qualify
    if: ${{ always() && (github.ref == 'refs/heads/main' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Delete this ref's superseded compiler caches, or every cache once its pull request closed
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CACHE_REF: ${{ github.ref }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          SUPERSEDED: |
            if $state != "open" then .
            else map(select(.key | startswith("kosmos-native-")))
              | map(select(.key | startswith("kosmos-native-v6-") | not))
                + (map(select(.key | startswith("kosmos-native-v6-")))
                  | group_by(.key | split("/")[0:2])
                  | map(sort_by(.key | split("/")[2] | split("-")
                      | [(.[1] | tonumber), (.[2] | tonumber), .[3] == "checked"]) | .[:-1])
                  | add // [])
            end
            | .[] | [.id, .size_in_bytes, .key] | @tsv
        run: |
          set -o pipefail
          trap 'status=$?; if [ "$status" != 0 ]; then printf "::warning::Compiler cache retention stopped where %s failed with status %d; what it did not delete stays until a later retention succeeds\n" "$BASH_COMMAND" "$status"; exit 0; fi' EXIT
          ref_caches() {
            gh api -X GET --paginate "repos/$GH_REPO/actions/caches" \
              -f ref="$CACHE_REF" -F per_page=100 --jq '.actions_caches[]'
          }
          state=open
          if [ -n "$PULL_REQUEST" ]; then
            state=$(gh api "repos/$GH_REPO/pulls/$PULL_REQUEST" --jq .state)
          fi
          ref_caches | jq -rs --arg state "$state" "$SUPERSEDED" > "$RUNNER_TEMP/superseded.tsv"
          while IFS=$'\t' read -r id bytes key; do
            echo "Deleting $key ($bytes bytes)"
            gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" --silent ||
              echo "::warning::Deleting $key failed"
          done < "$RUNNER_TEMP/superseded.tsv"
          for attempt in 1 2 3 4 5 6; do
            ref_caches > "$RUNNER_TEMP/remaining.json"
            grep -Fxq -f <(cut -f1 "$RUNNER_TEMP/superseded.tsv") \
              <(jq -r .id "$RUNNER_TEMP/remaining.json") || break
            if [ "$attempt" = 6 ]; then
              echo "::warning::A deleted cache is still listed after 30 seconds"
              break
            fi
            sleep 5
          done
          jq -rs --arg ref "$CACHE_REF" --arg state "$state" \
            '"\($ref) (\($state)): kept \(length) entries, \(map(.size_in_bytes) | add // 0) bytes"' \
            "$RUNNER_TEMP/remaining.json" | tee -a "$GITHUB_STEP_SUMMARY"
