name: Runtime qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tiger-style:
    name: TigerStyle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Check committed Zig changes and the native auditor
        env:
          TIGER_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'd777cfa402da97ff2299686f8365324b2f9b368c' }}
          TIGER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/tiger-style.sh "$TIGER_BASE" "$TIGER_HEAD"
      - name: Verify TigerStyle selection and failure behavior
        run: bash tools/test-tiger-style.sh
  qualify:
    name: Qualify / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [sessions, session-ownership, source-regressions, native, specialization, source, source-second, portable, consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          mirror: https://zigmirror.com
          use-cache: false
          use-tool-cache: true
      - name: Check source formatting before compilation
        run: |
          git ls-files '*.zig' | xargs zig fmt --check
      - name: Restore complete compiler cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache-upload
          key: kosmos-native-v2-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('build.zig.zon', 'build-profile.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kosmos-native-v2-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('build.zig.zon', 'build-profile.json') }}-
            kosmos-native-v2-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane == 'source' && 'source-second' || matrix.lane }}-${{ hashFiles('build.zig.zon', 'build-profile.json') }}-
            kosmos-native-v2-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-
            kosmos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('build.zig.zon', 'build-profile.json') }}-${{ matrix.lane == 'source' && 'source-second' || matrix.lane }}-
            kosmos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('build.zig.zon', 'build-profile.json') }}-${{ matrix.lane }}-
            kosmos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('build.zig.zon', 'build-profile.json') }}-
            kosmos-native-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-
      - name: Select working cache
        run: |
          if [ -d .zig-cache-upload ]; then
            test ! -e .zig-cache
            mv .zig-cache-upload .zig-cache
          fi
          mkdir -p .zig-cache/tmp
      - name: Record native compiler and restored target identities
        if: matrix.lane == 'native' || matrix.lane == 'source'
        run: |
          builtin_target() {
            awk '
              /^pub const (cpu|os):/ { active=1 }
              active {
                gsub(/^[[:space:]]+/, "")
                printf "%s ", $0
              }
              active && /^};/ { print ""; active=0 }
            '
          }
          zig version
          sha256sum "$(command -v zig)"
          printf 'CURRENT NATIVE TARGET\n'
          zig build-exe --show-builtin -fno-llvm -Osafe -mcpu=native \
            --global-cache-dir "$RUNNER_TEMP/zig-target-diagnostic-global" \
            --cache-dir "$RUNNER_TEMP/zig-target-diagnostic-local" |
            builtin_target
          cached_builtins=()
          if [ -d .zig-cache/b ]; then
            mapfile -t cached_builtins < <(
              find .zig-cache/b -mindepth 2 -maxdepth 2 \
                -type f -name builtin.zig -print | LC_ALL=C sort
            )
          fi
          printf 'RESTORED BUILTINS: %s; displaying at most 32\n' "${#cached_builtins[@]}"
          for builtin_file in "${cached_builtins[@]:0:32}"; do
            sha256sum "$builtin_file"
            builtin_target < "$builtin_file"
          done
      - name: Compile native qualification and independently rebuild the core
        if: matrix.lane == 'native'
        run: |
          nproc
          free -m
          vmstat -w 30 &
          observer=$!
          trap 'kill "$observer" 2>/dev/null || true' EXIT
          /usr/bin/time -v zig build build-storage-check build-semantics-check \
            build-zig17-check --cache-dir .zig-cache/native-owners \
            -Doptimize=safe --summary all --verbose &
          owners_pid=$!
          /usr/bin/time -v zig build build-semantic-driver-check \
            --cache-dir .zig-cache/native-driver -Doptimize=safe --summary all --verbose &
          driver_pid=$!
          compile_status=0
          wait "$owners_pid" || compile_status=1
          wait "$driver_pid" || compile_status=1
          exit "$compile_status"
      - name: Admit completed native compilation before execution
        id: native_cache_size
        if: matrix.lane == 'native'
        continue-on-error: true
        run: |
          echo 'save=false' >> "$GITHUB_OUTPUT"
          test -d .zig-cache/native-owners/o || exit 0
          test -d .zig-cache/native-driver/o || exit 0
          test -z "$(find .zig-cache ! -type d ! -type f -print -quit)" || exit 0
          test -n "$(find .zig-cache/native-owners/o .zig-cache/native-driver/o -type f -size +0c -print -quit)" || exit 0
          bytes=$(find .zig-cache -type f -printf '%s\n' | awk '{n+=$1} END {printf "%.0f",n}')
          echo "Compiler cache: $bytes bytes (4 GiB upload maximum)"
          test ! -e .zig-cache-upload
          cp -al .zig-cache .zig-cache-upload
          while IFS= read -r -d '' object; do
            test "$bytes" -gt 4294967296 || break
            object=${object#* }
            removed=$(find "$object" -type f -printf '%s\n' | awk '{n+=$1} END {printf "%.0f",n}')
            rm -rf -- "$object"
            bytes=$((bytes - removed))
          done < <(
            for objects in .zig-cache-upload/o .zig-cache-upload/native-owners/o .zig-cache-upload/native-driver/o; do
              test ! -d "$objects" || find "$objects" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\0'
            done | sort -zn
          )
          bytes=$(find .zig-cache-upload -type f -printf '%s\n' | awk '{n+=$1} END {printf "%.0f",n}')
          echo "Upload snapshot: $bytes bytes"
          test "$bytes" -le 4294967296 || exit 0
          test -n "$(find .zig-cache-upload/native-owners/o .zig-cache-upload/native-driver/o -type f -size +0c -print -quit)" || exit 0
          echo 'save=true' >> "$GITHUB_OUTPUT"
      - name: Retain completed native compilation before execution
        if: steps.native_cache_size.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache-upload
          key: kosmos-native-v2-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('build.zig.zon', 'build-profile.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check native owners and independently rebuild the core
        if: matrix.lane == 'native'
        run: |
          zig build check-storage check-semantics check-zig17 \
            --cache-dir .zig-cache/native-owners -Doptimize=safe --summary all
          zig build check-semantic-driver \
            --cache-dir .zig-cache/native-driver -Doptimize=safe --summary all
      - name: Check specialization and public receipt owners
        if: matrix.lane == 'specialization'
        run: >-
          zig build check-semantic-specialization check-publication
          -Doptimize=safe -Dpackaged-runtime=true --summary all
      - name: Check every selected current session fixture
        if: matrix.lane == 'sessions' || matrix.lane == 'session-ownership' || matrix.lane == 'source-regressions'
        run: |
          set -o pipefail
          if grep '^test "' test/v2/stable_source.zig | grep -Ev '^test "(behavior|ownership): '; then
            exit 1
          fi
          case "${{ matrix.lane }}" in
            sessions) group=behavior; expected=59 ;;
            session-ownership) group=ownership; expected=17 ;;
            source-regressions) group=regressions; expected=17 ;;
          esac
          zig build build-session-check -Dsession-group="$group" \
            -Doptimize=safe -Dpackaged-runtime=true --summary all
          zig-out/verification/sessions 2>&1 | tee "$RUNNER_TEMP/session-tests.log"
          if command -v rg >/dev/null; then
            rg -Fxq "All $expected tests passed." "$RUNNER_TEMP/session-tests.log"
          else
            grep -Fxq "All $expected tests passed." "$RUNNER_TEMP/session-tests.log"
          fi
      - name: Consume the actual native source package without a JS producer
        if: matrix.lane == 'consumer'
        run: |
          zig build emit-native-input -Doptimize=safe -Dpackaged-runtime=true --summary all
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/source" "$scratch/kosmos" "$scratch/consumer"
          git --no-replace-objects archive --format=tar HEAD > "$scratch/source.tar"
          tar -xf "$scratch/source.tar" -C "$scratch/source"
          package_hash=$(ZIG_GLOBAL_CACHE_DIR="$scratch/cache" zig fetch "$scratch/source")
          tar -xzf "$scratch/cache/p/$package_hash.tar.gz" --strip-components=1 -C "$scratch/kosmos"
          cp test/native_consumer/build.zig test/native_consumer/build.zig.zon test/native_consumer/main.zig "$scratch/consumer/"
          zig build --build-file "$scratch/consumer/build.zig" -Doptimize=safe -Dimage="$PWD/zig-out/native-consumer.bpi3" --summary all
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: matrix.lane == 'portable' || matrix.lane == 'source' || matrix.lane == 'source-second'
        with:
          node-version: '26.9.0'
      - name: Install only the browser boundary's tools
        if: matrix.lane == 'portable'
        run: |
          grep -Fq 'https://archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          npm ci --ignore-scripts --prefix test/current/browser-tools
          node test/current/browser-tools/node_modules/playwright-core/cli.js install --with-deps chromium firefox
      - name: Qualify the independent oracle and optional JS boundary
        if: matrix.lane == 'portable'
        # The independent lanes cover every dependency of `check` once.
        # Native qualification rebuilds and compares the exact packaged core.
        run: >-
          zig build check-activation-storage-wasm check-kernel
          check-capacity check-browser check-codecs check-package build-runtime
          -Doptimize=safe -Dpackaged-runtime=true --summary all
      - name: Qualify every source example and instruction frontier
        if: matrix.lane == 'source' || matrix.lane == 'source-second'
        run: |
          group=first
          if [ "${{ matrix.lane }}" = source-second ]; then group=second; fi
          zig build check-source -Dsource-group="$group" \
            -Doptimize=safe -Dpackaged-runtime=true --summary all
      - name: Package the tested ordinary JS consumer
        if: matrix.lane == 'portable'
        working-directory: zig-out/runtime
        run: |
          archive=$(npm pack --offline --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")
          mv "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/kosmos-runtime-package.tar.gz"
      - name: Retain the tested package
        if: matrix.lane == 'portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kosmos-runtime-package-${{ github.sha }}
          path: ${{ runner.temp }}/kosmos-runtime-package.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Admit complete bounded compiler cache
        id: cache_size
        if: ${{ !cancelled() && matrix.lane != 'native' }}
        continue-on-error: true
        run: |
          echo 'save=false' >> "$GITHUB_OUTPUT"
          test -d .zig-cache/o || exit 0
          test -z "$(find .zig-cache ! -type d ! -type f -print -quit)" || exit 0
          test -n "$(find .zig-cache/o -type f -size +0c -print -quit)" || exit 0
          bytes=$(find .zig-cache -type f -printf '%s\n' | awk '{n+=$1} END {printf "%.0f",n}')
          echo "Compiler cache: $bytes bytes (4 GiB upload maximum)"
          test "$bytes" -le 4294967296 || exit 0
          test ! -e .zig-cache-upload
          cp -al .zig-cache .zig-cache-upload
          echo 'save=true' >> "$GITHUB_OUTPUT"
      - name: Save useful cache without deleting outputs
        if: ${{ !cancelled() && steps.cache_size.outputs.save == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .zig-cache-upload
          key: kosmos-native-v2-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ matrix.lane }}-${{ hashFiles('build.zig.zon', 'build-profile.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
  runtime-complete:
    name: Runtime qualification budget
    needs: qualify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require runtime qualification within ten minutes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          QUALIFICATION: ${{ needs.qualify.result }}
        run: |
          test "$QUALIFICATION" = success
          started="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .run_started_at)"
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "Runtime qualification before budget gate: ${elapsed}s (maximum 600s; TigerStyle exempt)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -le 600
  complete:
    name: Complete qualification
    needs: [tiger-style, runtime-complete]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require TigerStyle and bounded runtime qualification
        env:
          TIGER_STYLE: ${{ needs.tiger-style.result }}
          QUALIFICATION: ${{ needs.runtime-complete.result }}
        run: |
          test "$TIGER_STYLE" = success
          test "$QUALIFICATION" = success
