name: Closed pull request caches
on:
  pull_request_target:
    types: [closed]
permissions:
  actions: write
jobs:
  delete:
    name: Delete a closed pull request's caches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete every cache saved for the closed pull request
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CACHE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
          DELETED: |
            $listed | map(select(.id as $id | all($remaining[]; .id != $id)))
            | "\($ref): deleted \(length) of \($listed | length) entries, \(map(.size_in_bytes) | add // 0) bytes"
        run: |
          set -o pipefail
          trap 'status=$?; if [ "$status" != 0 ]; then printf "::warning::Closed pull request cache cleanup stopped where %s failed with status %d; what it did not delete stays until GitHub removes it\n" "$BASH_COMMAND" "$status"; exit 0; fi' EXIT
          ref_caches() {
            gh api -X GET --paginate "repos/$GH_REPO/actions/caches" \
              -f ref="$CACHE_REF" -F per_page=100 --jq '.actions_caches[]'
          }
          listed() {
            grep -Fxq -f <(cut -f1 "$RUNNER_TEMP/closed.tsv") <(jq -r .id "$RUNNER_TEMP/remaining.json")
          }
          ref_caches > "$RUNNER_TEMP/closed.json"
          jq -r '[.id, .size_in_bytes, .key] | @tsv' "$RUNNER_TEMP/closed.json" > "$RUNNER_TEMP/closed.tsv"
          while IFS=$'\t' read -r id bytes key; do
            echo "Deleting $key ($bytes bytes)"
            gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" --silent ||
              echo "::warning::Deleting $key failed"
          done < "$RUNNER_TEMP/closed.tsv"
          for attempt in 1 2 3 4 5 6; do
            ref_caches > "$RUNNER_TEMP/remaining.json"
            listed || break
            if [ "$attempt" != 6 ]; then
              sleep 5
            fi
          done
          jq -nr --arg ref "$CACHE_REF" --slurpfile listed "$RUNNER_TEMP/closed.json" \
            --slurpfile remaining "$RUNNER_TEMP/remaining.json" "$DELETED" | tee -a "$GITHUB_STEP_SUMMARY"
          if listed; then
            echo "::warning::A deleted cache is still listed after 30 seconds"
          fi
