name: Closed pull request caches
on:
  pull_request_target:
    types: [closed]
permissions:
  actions: write
jobs:
  delete:
    name: Delete a closed pull request's caches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete every cache saved for the closed pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CACHE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -o pipefail
          ref_caches() {
            gh api -X GET --paginate "repos/$GH_REPO/actions/caches" \
              -f ref="$CACHE_REF" -F per_page=100 --jq '.actions_caches[]'
          }
          ref_caches > "$RUNNER_TEMP/closed.json"
          jq -r '[.id, .size_in_bytes, .key] | @tsv' "$RUNNER_TEMP/closed.json" |
            while IFS=$'\t' read -r id bytes key; do
              echo "Deleting $key ($bytes bytes)"
              gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" --silent || true
            done
          deleted=$(jq -rs '"\(length) (\(map(.size_in_bytes) | add // 0) bytes)"' \
            "$RUNNER_TEMP/closed.json")
          ref_caches > "$RUNNER_TEMP/remaining.json"
          read -r undeleted later < <(jq -rn --slurpfile listed "$RUNNER_TEMP/closed.json" \
            --slurpfile now "$RUNNER_TEMP/remaining.json" \
            '[$now[].id] as $n | ($n - [$listed[].id]) as $new | "\($n - $new | length) \($new | length)"')
          echo "$CACHE_REF caches: deleted $deleted; $undeleted listed entries remain; $later saved after the listing, for the budget job to delete" |
            tee -a "$GITHUB_STEP_SUMMARY"
          test "$undeleted" -eq 0
